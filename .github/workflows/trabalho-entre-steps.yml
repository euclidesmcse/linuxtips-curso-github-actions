name: primeiro workflow Linuxtips

on: 
    push:
        branches:
            - main

jobs:
    giropops:
        runs-on: ubuntu-latest
        steps: 
            - name: Confere  versai do ubuntu
              run: cat /etc/os-release

            - name: Exibir uma mensagem
              run: echo "Estou fazendo curso na Linux" > mensagem.txt

            - name: Qualquer outra coisa
              run: ls -lha

            - name: Ler conteudo do arquivo
              run: cat mensagem.txt
