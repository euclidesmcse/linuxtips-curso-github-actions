name: Vendeo arquivos compartilhado entre steps

on:
  push:
    branches:
      - main

jobs:
  jobs01:
      runs-on: ubuntu-26.04
      steps:
        - name: Confere versao ubuntu
          run: cat /etc/os-release

        - name: Exibir uma mensagem
          run: echo "Estou fazendo o curso de github actions da Linuxtips" > mensagem.txt                                                                                                                                                   
  jobs02:
      runs-on: ubuntu-26.04
      steps:
        - name: Ver conteudo do diretorio
          run: ls -lha

        - uses: actions/download-artifact@v4
          with:
            name: Strigus
            path: mensagem.txt

        - name: Ver o conteudo do diretorio
          run: ls -lha  && ls ./strigus/
        
        - name: Acessa arquivo mensagem
          run: mv strigus/mensagem.txt . && rm -rf ./strigus

        - name: Ver conteudo do diretorio
          run: ls -lha
        
        - name: Acessa arquivo mensagem
          run: cat mensagem.txt
