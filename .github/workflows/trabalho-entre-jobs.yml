name: Vendo arquivos compartilhado entre steps

on:
  push:
    branches:
      - main

jobs:
  jobs_1:
    runs-on: ubuntu-latest

    steps:
      - name: Confere versao do ubuntu
        run: cat /etc/os-release

      - name: Exibir uma mensagem
        run: echo "Estou fazendo curso na Linux" > mensagem.txt

      - uses: actions/upload-artifact@v4
        with:
          name: strigus
          path: mensagem.txt

  jobs_2:
    runs-on: ubuntu-latest

    steps:
      - name: Acessa arquivos mensagem
        run: ls -lha

      - uses: actions/download-artifact@v4
        with:
          name: strigus
          path: strigus

      - name: Acessa arquivos mensagem
        run: ls -lha && ls ./strigus/

      - name: Movendo arquivos strigus e removendo
        run: mv strigus/mensagem.txt . && rm -rf ./strigus

      - name: Acessa arquivos mensagem
        run: ls -lha

      - name: Exibe o conteúdo do arquivo
        run: cat mensagem.txt