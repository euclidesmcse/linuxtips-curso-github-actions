# =============================================================================
# DESAFIO 01 - EXECUTANDO OPERAÇÕES COM DOCKER NO GITHUB ACTIONS
# =============================================================================
#
# Este workflow foi criado para resolver o "Desafio 01" do curso de GitHub
# Actions da Linuxtips. Ele demonstra, na prática, três conceitos fundamentais:
#
#   1) Como disparar um workflow MANUALMENTE (workflow_dispatch), permitindo
#      que o usuário escolha quando a automação deve rodar, sem depender de
#      eventos automáticos como push ou pull_request.
#
#   2) Como receber ENTRADAS DE DADOS (inputs) do usuário no momento da
#      execução. Isso permite reaproveitar o mesmo workflow para testar
#      diferentes imagens Docker, sem precisar editar este arquivo .yml.
#
#   3) Como executar comandos Docker dentro de um runner do GitHub Actions.
#      O runner ubuntu-latest já vem com o Docker instalado e com o daemon em
#      execução, então `docker pull` e `docker images` funcionam direto, sem
#      nenhum passo de instalação. Para o desafio adicional usamos a Action
#      oficial `docker/scout-action` (Docker Scout) para análise de CVEs.
#
# -----------------------------------------------------------------------------
# COMO EXECUTAR ESTE WORKFLOW
# -----------------------------------------------------------------------------
#   1) Acesse a aba "Actions" do repositório no GitHub.
#   2) No menu lateral esquerdo, clique em "Desafio 01 - Operações com Docker".
#   3) Clique no botão "Run workflow" (Executar workflow).
#   4) No campo "Imagem Docker", informe a imagem no formato `imagem:tag`
#      (ex.: alpine:latest, nginx:1.27, node:20-alpine).
#   5) Clique em "Run workflow" e acompanhe os logs em tempo real.
#
# -----------------------------------------------------------------------------
# PRÉ-REQUISITO DO DESAFIO ADICIONAL (Docker Scout)
# -----------------------------------------------------------------------------
# O Docker Scout EXIGE autenticação no Docker Hub. Sem credenciais, o step de
# análise falha com erro de autenticação. Para usar essa parte:
#
#   1) Crie um Access Token em:
#      https://app.docker.com/settings/personal-access-tokens
#   2) No repositório, vá em Settings > Secrets and variables > Actions e
#      cadastre dois secrets:
#        - DOCKERHUB_USER  (seu usuário do Docker Hub)
#        - DOCKERHUB_PAT   (o token gerado no passo 1)
#
# Se os secrets NÃO estiverem cadastrados, os steps do Scout são pulados
# automaticamente (veja o `if:` deles) e o workflow continua verde, cumprindo
# o desafio principal normalmente.
#
# -----------------------------------------------------------------------------
# DOCUMENTAÇÃO DIDÁTICA PARA ESTAGIÁRIOS
# -----------------------------------------------------------------------------
#   • `on:` define os gatilhos do workflow. Aqui usamos apenas `workflow_dispatch`,
#     que é o gatilho manual. Não há `push:` nem `pull_request:` porque o
#     requisito do desafio é que o workflow NÃO rode automaticamente.
#
#   • `workflow_dispatch.inputs:` permite criar um formulário simples para o
#     usuário informar valores no momento da execução. Cada input tem:
#       - description: texto exibido como dica ao usuário
#       - required:    se o campo é obrigatório (true/false)
#       - default:     valor padrão caso o usuário deixe em branco
#       - type:        tipo do input (string, boolean, choice, environment)
#
#   • `inputs.image` será referenciado nos steps como `${{ inputs.image }}`.
#     Esse é o jeito de "passar o valor informado pelo usuário para os comandos".
#
#   • `permissions:` define o que o GITHUB_TOKEN pode fazer neste workflow.
#     Declarar explicitamente o mínimo necessário (aqui, apenas leitura do
#     código) é a prática de "menor privilégio" recomendada pelo GitHub.
#
#   • `jobs.<nome>.runs-on:` indica em qual máquina virtual o job será
#     executado. Usamos `ubuntu-latest` (mais estável e amplamente suportado).
#
#   • `steps:` é a lista ordenada de tarefas que o runner executará.
#     Cada step tem um `name` (apenas descritivo, aparece nos logs) e uma
#     ação (`uses:` para Actions prontas ou `run:` para comandos shell).
#
#   • Variáveis de ambiente (`env:`) no nível do job ficam disponíveis para
#     todos os steps. Usamos isso para definir IMAGE=${{ inputs.image }}
#     uma única vez e reutilizar nos steps seguintes.
# =============================================================================

name: Desafio 01 - Operações com Docker

# -----------------------------------------------------------------------------
# GATILHOS (on)
# -----------------------------------------------------------------------------
# Só aceitamos disparo MANUAL. Não usamos push, pull_request nem schedule.
# Isso garante que o workflow só rode quando alguém clicar em "Run workflow".
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Imagem Docker a ser baixada (formato imagem:tag, ex: alpine:latest)"
        required: true
        default: "alpine:latest"
        type: string

# -----------------------------------------------------------------------------
# PERMISSÕES DO GITHUB_TOKEN
# -----------------------------------------------------------------------------
# Menor privilégio: este workflow só precisa ler o repositório. Sem esse bloco,
# o token herdaria as permissões padrão configuradas no repositório, que podem
# ser bem mais amplas do que o necessário.
# -----------------------------------------------------------------------------
permissions:
  contents: read

# -----------------------------------------------------------------------------
# JOBS
# -----------------------------------------------------------------------------
# Apenas um job é necessário para cumprir o desafio. Poderíamos separar em
# múltiplos jobs, mas como todos os passos dependem da mesma máquina (o
# mesmo contexto Docker), manter tudo em um único job é mais simples e didático.
# -----------------------------------------------------------------------------
jobs:
  docker-operations:
    name: Operações com Docker
    runs-on: ubuntu-latest

    # Variáveis reutilizáveis em todos os steps deste job.
    #
    # Detalhe importante: o contexto `secrets` NÃO está disponível em um `if:`
    # de step. Por isso copiamos o secret para uma variável de ambiente aqui, o
    # que nos permite escrever `if: env.DOCKERHUB_USER != ''` mais abaixo e
    # pular o Docker Scout quando não há credenciais cadastradas.
    env:
      IMAGE: ${{ inputs.image }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}

    steps:
      # -------------------------------------------------------------------------
      # STEP 0 - Checkout do repositório
      # -------------------------------------------------------------------------
      # Boa prática: sempre faça checkout do código no início do job.
      # actions/checkout baixa o conteúdo do repositório para o workspace do
      # runner. Mesmo que este workflow não use o código em si, é um padrão
      # recomendado e útil em pipelines reais.
      # -------------------------------------------------------------------------
      - name: Checkout do repositório
        uses: actions/checkout@v5

      # -------------------------------------------------------------------------
      # STEP 1 - Download da imagem Docker (docker pull)
      # -------------------------------------------------------------------------
      # Aqui executamos o comando `docker pull` passando a imagem informada
      # pelo usuário. O `$IMAGE` vem da variável de ambiente definida em `env:`,
      # e o valor dela foi capturado de `inputs.image` no disparo manual.
      #
      # ATENÇÃO, estagiário: `$IMAGE` e `${{ env.IMAGE }}` NÃO são equivalentes
      # em segurança. A expressão `${{ ... }}` é substituída pelo GitHub ANTES
      # de o shell existir, ou seja, o texto digitado pelo usuário vira parte do
      # script — o que abre espaço para "script injection" (imagine alguém
      # digitando `alpine; rm -rf /`). Já `$IMAGE` é lido pelo shell como dado,
      # nunca como código. Por isso, dentro de `run:`, SEMPRE prefira a
      # variável de ambiente — e entre aspas, para não sofrer word splitting.
      # -------------------------------------------------------------------------
      - name: Download da imagem (docker pull)
        run: docker pull "$IMAGE"

      # -------------------------------------------------------------------------
      # STEP 2 - Listagem das imagens no runner (docker images)
      # -------------------------------------------------------------------------
      # Após o pull, listamos as imagens presentes no runner para que, pelos
      # logs, seja possível confirmar visualmente que a imagem informada
      # realmente foi baixada e está disponível localmente.
      #
      # O argumento de `docker images` NÃO é uma busca por texto: ele é um
      # filtro no formato REPOSITORY[:TAG] (aceita curingas, ex.: `alpine*`).
      # Passar `$IMAGE` aqui restringe a listagem exatamente à imagem baixada.
      # -------------------------------------------------------------------------
      - name: Listagem das imagens disponíveis (docker images)
        run: docker images "$IMAGE"

      # -------------------------------------------------------------------------
      # STEP 3 - DESAFIO ADICIONAL: Login no Docker Hub
      # -------------------------------------------------------------------------
      # O Docker Scout só funciona autenticado no Docker Hub. Fazemos o login
      # com a Action oficial `docker/login-action`, usando os secrets do
      # repositório (veja a seção "PRÉ-REQUISITO" no topo do arquivo).
      #
      # O `if:` abaixo pula este step (e o próximo) quando o secret não existe,
      # evitando que o workflow quebre para quem ainda não configurou as
      # credenciais. Note que testamos `env.DOCKERHUB_USER`, e não
      # `secrets.DOCKERHUB_USER`: o contexto `secrets` não está disponível
      # em `if:` de step, daí o mapeamento feito no `env:` do job.
      # -------------------------------------------------------------------------
      - name: Login no Docker Hub (necessário para o Docker Scout)
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      # -------------------------------------------------------------------------
      # STEP 4 - DESAFIO ADICIONAL: Análise de vulnerabilidades (Docker Scout)
      # -------------------------------------------------------------------------
      # O Docker Scout é a ferramenta oficial do Docker para análise de CVEs
      # (vulnerabilidades conhecidas) em imagens. Ele consulta bases de dados
      # públicas e gera um resumo com a quantidade de vulnerabilidades por
      # severidade (LOW, MEDIUM, HIGH, CRITICAL).
      #
      # Usamos a Action oficial `docker/scout-action`, publicada pela própria
      # Docker, que é a forma recomendada e mais segura de integrar o
      # Docker Scout ao GitHub Actions.
      #
      # O parâmetro `image` recebe o valor informado pelo usuário, garantindo
      # que a mesma imagem do `docker pull` seja a imagem analisada.
      #
      # Referência: https://github.com/docker/scout-action
      # -------------------------------------------------------------------------
      - name: Análise de vulnerabilidades com Docker Scout
        if: env.DOCKERHUB_USER != ''
        # `continue-on-error: true` faz o WORKFLOW seguir em frente mesmo que
        # este step falhe. O step ainda aparece marcado com aviso e o relatório
        # continua visível no log — só não derruba o job inteiro.
        #
        # Por que usar isso aqui: o `exit-code: true` abaixo é um "quality gate"
        # de verdade, e imagens públicas quase sempre têm alguma CVE HIGH em
        # aberto (a `alpine:latest`, por exemplo, acusa 7 no openssl). Num
        # repositório de estudo, queremos VER o gate funcionando sem que o
        # desafio fique permanentemente vermelho.
        #
        # ATENÇÃO: em um pipeline de produção você faria o CONTRÁRIO — remover
        # esta linha é justamente o que dá dentes ao gate e impede que uma
        # imagem vulnerável avance para o deploy.
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE }}
          # O nome correto do filtro de severidade é `only-severities`
          # (no plural). Cuidado: o GitHub Actions apenas emite um WARNING
          # para inputs inexistentes em `with:`, ele não falha — então um
          # nome errado aqui seria silenciosamente ignorado.
          #
          # Filtramos só em critical/high porque este step é um "quality gate"
          # (veja `exit-code` abaixo). Incluir `low` faria praticamente
          # qualquer imagem real reprovar o pipeline.
          only-severities: critical,high
          # `exit-code: true` faz o step falhar (status vermelho) quando
          # alguma vulnerabilidade das severidades filtradas é encontrada.
          # É assim que se BLOQUEIA um pipeline em produção.
          exit-code: true
          # `only-fixed: true` mostra apenas vulnerabilidades que já possuem
          # correção disponível — ajuda a priorizar o que dá para resolver
          # agora, atualizando a imagem base ou os pacotes.
          only-fixed: true
          # `summary: true` imprime um resumo compacto no log, em vez da
          # lista completa de CVEs. Facilita a leitura no console.
          summary: true
